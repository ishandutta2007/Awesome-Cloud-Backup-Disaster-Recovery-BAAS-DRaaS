<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="badge-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(56, 189, 248, 0.2)"/><stop offset="100%" stop-color="rgba(129, 140, 248, 0.05)"/></linearGradient><linearGradient id="flow-line-1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="orb-glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="35"/></filter><pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.15)"/></pattern></defs><style>@keyframes pulseOrb{0%{opacity:.25;transform:scale(1)}50%{opacity:.45;transform:scale(1.12)}}@keyframes streamPacket1{0%{stroke-dashoffset:600;opacity:0}20%,80%{opacity:1}}@keyframes streamPacket2{0%{stroke-dashoffset:500;opacity:0}25%,75%{opacity:1}}@keyframes radarPing{0%{r:16;opacity:.8;stroke-width:2.5}}.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.gradient-word{fill:url(#primary-grad)}.subtitle-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:400;font-size:18px;fill:#94a3b8;letter-spacing:.2px}.pill-text{font-weight:600;font-size:13px;letter-spacing:.5px;fill:#38bdf8}.pill-text,.stat-label,.stat-val{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.stat-label{font-weight:500;font-size:12px;fill:#64748b;text-transform:uppercase;letter-spacing:1px}.stat-val{font-weight:700;font-size:16px;fill:#e2e8f0}.orb-anim-1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:200px 100px}.orb-anim-2{animation:pulseOrb 10s ease-in-out infinite alternate-reverse;transform-origin:1000px 320px}.packet-stream-1{stroke-dasharray:80 400;animation:streamPacket1 5s linear infinite}.packet-stream-2{stroke-dasharray:60 300;animation:streamPacket2 6s linear infinite}.ping-circle,.ping-circle-delay{animation:radarPing 3s cubic-bezier(0,.2,.8,1) infinite}.ping-circle-delay{animation-delay:1.5s}</style><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#grid-pattern)" rx="16"/><g><circle cx="220" cy="90" r="140" fill="#38bdf8" class="orb-anim-1" filter="url(#orb-glow)"/><circle cx="1020" cy="310" r="160" fill="#818cf8" class="orb-anim-2" filter="url(#orb-glow)"/><circle cx="600" cy="210" r="100" fill="#c084fc" filter="url(#orb-glow)" opacity=".12"/></g><g opacity=".6"><path fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" d="M 60 340 C 300 340, 420 380, 680 380 C 940 380, 1020 320, 1140 320"/><path fill="none" stroke="#38bdf8" stroke-width="3" d="M 60 340 C 300 340, 420 380, 680 380 C 940 380, 1020 320, 1140 320" class="packet-stream-1" filter="url(#glow)"/><path fill="none" stroke="rgba(129, 140, 248, 0.15)" stroke-width="2" d="M 100 80 C 400 80, 520 40, 800 40 C 980 40, 1060 90, 1120 90"/><path fill="none" stroke="#8
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.05)" />
    </linearGradient>

    <linearGradient id="flow-line-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orb-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .gradient-word {
      fill: url(#primary-grad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
      fill: #38bdf8;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #e2e8f0;
    }

    /* Ambient Pulsing Glow */
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.12); }
    }
    .orb-anim-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .orb-anim-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
      transform-origin: 1000px 320px;
    }

    /* Streaming Data Packets */
    @keyframes streamPacket1 {
      0% { stroke-dashoffset: 600; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes streamPacket2 {
      0% { stroke-dashoffset: 500; opacity: 0; }
      25% { opacity: 1; }
      75% { opacity: 1; }
      100% { stroke-dashoffset: -500; opacity: 0; }
    }
    .packet-stream-1 {
      stroke-dasharray: 80 400;
      animation: streamPacket1 5s linear infinite;
    }
    .packet-stream-2 {
      stroke-dasharray: 60 300;
      animation: streamPacket2 6s linear infinite;
    }

    /* Cloud Pulse Ring */
    @keyframes radarPing {
      0% { r: 16; opacity: 0.8; stroke-width: 2.5; }
      100% { r: 52; opacity: 0; stroke-width: 0.5; }
    }
    .ping-circle {
      animation: radarPing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .ping-circle-delay {
      animation: radarPing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      animation-delay: 1.5s;
    }
  </style>

  <!-- 1. Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid-pattern)" rx="16" />

  <!-- 2. Animated Ambient Glow Orbs (Subtle Background Only) -->
  <g>
    <circle class="orb-anim-1" cx="220" cy="90" r="140" fill="#38bdf8" filter="url(#orb-glow)" />
    <circle class="orb-anim-2" cx="1020" cy="310" r="160" fill="#818cf8" filter="url(#orb-glow)" />
    <circle cx="600" cy="210" r="100" fill="#c084fc" filter="url(#orb-glow)" opacity="0.12" />
  </g>

  <!-- 3. Dynamic Circuit / Flow Lines (Background Telemetry) -->
  <g opacity="0.6">
    <!-- Curved telemetry track -->
    <path d="M 60 340 C 300 340, 420 380, 680 380 C 940 380, 1020 320, 1140 320" 
          fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" />
    <path class="packet-stream-1" d="M 60 340 C 300 340, 420 380, 680 380 C 940 380, 1020 320, 1140 320" 
          fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />

    <!-- Upper track -->
    <path d="M 100 80 C 400 80, 520 40, 800 40 C 980 40, 1060 90, 1120 90" 
          fill="none" stroke="rgba(129, 140, 248, 0.15)" stroke-width="2" />
    <path class="packet-stream-2" d="M 100 80 C 400 80, 520 40, 800 40 C 980 40, 1060 90, 1120 90" 
          fill="none" stroke="#818cf8" stroke-width="2.5" filter="url(#glow)" />
  </g>

  <!-- 4. Graphic Visual Anchor: Dynamic Cloud + Shield Resilience Nodes (Right Side) -->
  <g transform="translate(930, 180)">
    <!-- Radar Ping Rings -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#38bdf8" class="ping-circle" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#818cf8" class="ping-circle-delay" />

    <!-- Outer Hexagon Node Ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" stroke-dasharray="6 6" />

    <!-- Satellite Nodes -->
    <g transform="rotate(45)">
      <circle cx="0" cy="-82" r="5" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="0" cy="82" r="5" fill="#818cf8" filter="url(#glow)" />
    </g>
    <g transform="rotate(-45)">
      <circle cx="-82" cy="0" r="5" fill="#c084fc" filter="url(#glow)" />
      <circle cx="82" cy="0" r="5" fill="#38bdf8" filter="url(#glow)" />
    </g>

    <!-- Center Resilience Shield / Cloud Base -->
    <circle cx="0" cy="0" r="46" fill="#0f172a" stroke="url(#primary-grad)" stroke-width="2.5" filter="url(#glow)" />
    
    <!-- Cloud & Shield Icon -->
    <path d="M -16 -4 C -16 -13 -8 -20 2 -20 C 10 -20 17 -15 19 -8 C 24 -7 28 -3 28 3 C 28 9 23 14 17 14 L -15 14 C -20 14 -24 10 -24 5 C -24 0 -20 -4 -16 -4 Z" 
          fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 0 -2 L 0 8 M -5 3 L 0 8 L 5 3" 
          fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 5. Foreground Content (Strictly In Front, High Contrast) -->
  <!-- Tagline Pill -->
  <g transform="translate(80, 65)">
    <rect width="280" height="34" rx="17" fill="url(#badge-grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="22" class="pill-text">CLOUD RESILIENCE ARCHITECTURE</text>
  </g>

  <!-- Title -->
  <text x="80" y="150" class="title-text">
    Awesome Cloud <tspan class="gradient-word">Backup &amp; DR</tspan>
  </text>
  <text x="80" y="195" class="title-text" style="font-size: 30px; fill: #cbd5e1; font-weight: 600;">
    BaaS · DRaaS · Cyber-Resilient Recovery
  </text>

  <!-- Subtitle -->
  <text x="80" y="242" class="subtitle-text">
    Curated ecosystem of enterprise SaaS platforms and battle-tested open-source tools
  </text>
  <text x="80" y="268" class="subtitle-text" style="font-size: 15px; fill: #64748b;">
    Continuous replication · Immutable snapshots · Orchestrated failover · Clean-room restoration
  </text>

  <!-- 6. Bottom Metrics Card Strip (Foreground) -->
  <g transform="translate(80, 310)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="180" height="62" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="16" y="26" class="stat-label">BaaS Market 2026</text>
    <text x="16" y="48" class="stat-val">$11.4B – $14.5B</text>

    <!-- Card 2 -->
    <rect x="200" y="0" width="180" height="62" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="216" y="26" class="stat-label">DRaaS Market 2026</text>
    <text x="216" y="48" class="stat-val">$16.4B – $23.1B</text>

    <!-- Card 3 -->
    <rect x="400" y="0" width="180" height="62" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="416" y="26" class="stat-label">RPO Target</text>
    <text x="416" y="48" class="stat-val">Sub-Minute / CDP</text>

    <!-- Card 4 -->
    <rect x="600" y="0" width="180" height="62" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="616" y="26" class="stat-label">Ecosystem Focus</text>
    <text x="616" y="48" class="stat-val">SaaS &amp; Open Source</text>
  </g>
</svg>
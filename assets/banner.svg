ested open-source tools</text><text x="80" y="268" class="subtitle-text" style="font-size:15px;fill:#64748b">Continuous replication · Immutable snapshots · Orchestrated failover · Clean-room restoration</text><g transform="translate(80, 310)"><rect width="180" height="62" x="0" y="0" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="10"/><text x="16" y="26" class="stat-label">BaaS Market 2026</text><text x="16" y="48" class="stat-val">$11.4B – $14.5B</text><rect width="180" height="62" x="200" y="0" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="10"/><text x="216" y="26" class="stat-label">DRaaS Market 2026</text><text x="216" y="48" class="stat-val">$16.4B – $23.1B</text><rect width="180" height="62" x="400" y="0" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="10"/><text x="416" y="26" class="stat-label">RPO Target</text><text x="416" y="48" class="stat-val">Sub-Minute / CDP</text><rect width="180" height="62" x="600" y="0" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" rx="10"/><text x="616" y="26" class="stat-label">Ecosystem Focus</text><text x="616" y="48" class="stat-val">SaaS &amp; Open Source</text></g></svg>